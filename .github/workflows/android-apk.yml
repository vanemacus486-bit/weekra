name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Android runner
        run: flutter create --platforms=android --project-name weekra --org app.weekra .

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare download filename
        run: cp build/app/outputs/flutter-apk/app-release.apk Weekra-Android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekra-android-release
          path: Weekra-Android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          RELEASE_TAG="v${APP_VERSION%%+*}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Weekra-Android.apk --clobber
          else
            gh release create "$RELEASE_TAG" Weekra-Android.apk \
              --target "$GITHUB_SHA" \
              --title "Weekra ${APP_VERSION%%+*}" \
              --notes "Weekra Android release."
          fi
