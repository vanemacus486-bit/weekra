name: Flutter Preview

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'l10n.yaml'
      - 'pubspec.yaml'
      - 'tool/preview_test.dart'
      - '.github/workflows/flutter-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Render previews
        run: flutter test --update-goldens tool/preview_test.dart

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: weekra-previews
          path: tool/goldens/*.png
          if-no-files-found: error
          retention-days: 14

