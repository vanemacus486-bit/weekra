name: Flutter Preview

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'l10n.yaml'
      - 'pubspec.yaml'
      - 'tool/preview_test.dart'
      - '.github/workflows/flutter-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Render wide desktop
        if: always()
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded --update-goldens tool/preview_test.dart --plain-name 'renders the wide desktop week' > wide-preview.log 2>&1
          test_status=$?
          exit "$test_status"

      - name: Upload wide desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-preview-log
          path: wide-preview.log
          retention-days: 2

      - name: Render crowded desktop
        if: always()
        run: flutter test --update-goldens tool/preview_test.dart --plain-name 'renders a crowded narrow desktop week'

      - name: Render empty desktop
        if: always()
        run: flutter test --update-goldens tool/preview_test.dart --plain-name 'renders an empty desktop week'

      - name: Render mobile agenda
        if: always()
        run: flutter test --update-goldens tool/preview_test.dart --plain-name 'renders the mobile agenda'

      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekra-previews
          path: tool/goldens/*.png
          if-no-files-found: error
          retention-days: 14
