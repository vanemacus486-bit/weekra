name: Windows updater end to end

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Windows Release']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/updater/**'
      - 'installer/**'
      - 'tool/windows_update_smoke.dart'
      - '.github/workflows/windows-updater-e2e.yml'

permissions:
  contents: read

jobs:
  update-installed-copy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build deliberately old updater client
        shell: pwsh
        run: |
          flutter create . --platforms=windows
          flutter pub get
          flutter gen-l10n
          flutter build windows --release `
            --target tool/windows_update_smoke.dart `
            --dart-define=WEEKRA_VERSION=0.0.0

      - name: Run a real update and verify replacement
        shell: pwsh
        run: |
          $executable = Resolve-Path 'build/windows/x64/runner/Release/weekra.exe'
          $before = (Get-FileHash -Algorithm SHA256 $executable).Hash
          $client = Start-Process -FilePath $executable -PassThru
          if (-not $client.WaitForExit(240000)) {
            Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            throw 'The updater client did not hand off to the installer.'
          }
          if ($client.ExitCode -ne 0) {
            throw "The updater client exited with code $($client.ExitCode)."
          }

          $changed = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            Start-Sleep -Seconds 1
            try {
              $after = (Get-FileHash -Algorithm SHA256 $executable).Hash
              if ($after -ne $before) {
                $changed = $true
                break
              }
            } catch {
              # The installer may hold the executable briefly while replacing it.
            }
          }
          if (-not $changed) {
            Get-ChildItem "$env:APPDATA" -Filter update.log -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName }
            throw 'The installed Weekra executable was never replaced.'
          }

          $restarted = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Seconds 1
            $process = Get-Process weekra -ErrorAction SilentlyContinue
            if ($process) {
              $restarted = $true
              $process | Stop-Process -Force
              break
            }
          }
          if (-not $restarted) {
            throw 'Weekra was updated but did not restart.'
          }

          $logs = Get-ChildItem "$env:APPDATA" -Filter update.log -Recurse -ErrorAction SilentlyContinue
          if (-not $logs) { throw 'The updater did not write its persistent log.' }
          $success = $logs | Where-Object {
            (Get-Content $_.FullName -Raw) -match 'Update installed successfully'
          }
          if (-not $success) {
            $logs | ForEach-Object { Get-Content $_.FullName }
            throw 'The persistent update log did not record success.'
          }

      - name: Upload updater log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekra-update-log
          path: ~/AppData/Roaming/**/update.log
          if-no-files-found: warn
          retention-days: 14
