name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'l10n.yaml'
      - 'installer/**'
      - 'windows/**'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*([^+\s]+)'
          if (-not $line) { throw 'Version is missing from pubspec.yaml.' }
          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require a new release version
        id: version_guard
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPAIR_TARGET: e43196899d099d080192c42df1ffe0a65ca371dc
        shell: pwsh
        run: |
          $releases = gh api 'repos/${{ github.repository }}/releases' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release versions.' }
          $existing = $releases | Where-Object { $_.tag_name -eq "v$env:VERSION" } | Select-Object -First 1
          if ($existing) {
            if ($env:VERSION -eq '0.5.5' -and $existing.target_commitish -eq $env:REPAIR_TARGET) {
              "replace_release=true" >> $env:GITHUB_OUTPUT
              Write-Host 'Repairing the just-published 0.5.5 compatibility manifest once.'
            } else {
              throw "Version $env:VERSION already exists. Increase pubspec.yaml and app_version.dart; never replace an existing update."
            }
          } else {
            "replace_release=false" >> $env:GITHUB_OUTPUT
            foreach ($release in $releases) {
              if (-not $release.prerelease -and -not $release.draft) {
                $published = $release.tag_name.TrimStart('v')
                if ([version]$published -ge [version]$env:VERSION) {
                  throw 'The new version must exceed every stable release.'
                }
              }
            }
          }
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create . --platforms=windows

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=WEEKRA_VERSION=${{ steps.version.outputs.version }}

      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $release = 'build/windows/x64/runner/Release'
          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath 'dist/weekra-windows-x64.zip' `
            -Force

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            'installer/weekra.iss'

      - name: Create update manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $archive = 'dist/weekra-windows-x64.zip'
          $installer = 'dist/weekra-setup-x64.exe'
          $archiveSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $installerSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            windows = [ordered]@{
              url = "https://github.com/${{ github.repository }}/releases/download/v$version/weekra-windows-x64.zip"
              sha256 = $archiveSha256
              installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/weekra-setup-x64.exe"
              installerSha256 = $installerSha256
            }
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content `
            -Path 'dist/update.json' `
            -Encoding utf8NoBOM

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekra-windows-${{ steps.version.outputs.version }}
          path: |
            dist/weekra-setup-x64.exe
            dist/weekra-windows-x64.zip
            dist/update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            'dist/weekra-setup-x64.exe'
            'dist/weekra-windows-x64.zip'
            'dist/update.json'
          )
          if ('${{ steps.version_guard.outputs.replace_release }}' -eq 'true') {
            gh release upload $tag $assets `
              --clobber `
              --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw 'Release asset repair failed.' }
            gh release edit $tag `
              --target '${{ github.sha }}' `
              --title "Weekra $env:VERSION" `
              --latest `
              --repo '${{ github.repository }}'
          } else {
            gh release create $tag $assets `
              --target '${{ github.sha }}' `
              --title "Weekra $env:VERSION" `
              --generate-notes `
              --latest `
              --repo '${{ github.repository }}'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
