name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test basic week view
        if: always()
        run: flutter test --plain-name 'shows the Weekra week view'

      - name: Test absent storage
        if: always()
        run: flutter test --plain-name 'does not write preview data when storage is absent'

      - name: Test overlap lanes
        if: always()
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded --plain-name 'lays overlapping events out in separate lanes' > overlap-test.log 2>&1
          test_status=$?
          exit "$test_status"

      - name: Upload overlap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlap-test-log
          path: overlap-test.log
          retention-days: 2

      - name: Test mobile layout switch
        if: always()
        run: flutter test --plain-name 'switches between Grid and Hourly on a phone'

      - name: Test event creation
        if: always()
        run: flutter test --plain-name 'creates and saves an event'

      - name: Test grid selection
        if: always()
        run: flutter test --plain-name 'creates an event by selecting and stretching a time block'

      - name: Test event movement
        if: always()
        run: flutter test --plain-name 'presses and drags an event to another day and time'

      - name: Test event resizing
        if: always()
        run: flutter test --plain-name 'stretches a selected event from its end handle'

      - name: Test event editing
        if: always()
        run: flutter test --plain-name 'edits an existing event'

      - name: Test event deletion
        if: always()
        run: flutter test --plain-name 'deletes an existing event after confirmation'

      - name: Test Chinese large type
        if: always()
        run: flutter test --plain-name 'supports Simplified Chinese throughout the event flow'

      - name: Test pseudo-localization
        if: always()
        run: flutter test --plain-name 'pseudo-localization tolerates expanded text and large type'
